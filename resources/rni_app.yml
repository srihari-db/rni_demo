resources:
  apps:
    rni_command_center:
      name: rni-command-center
      description: "RNI Intelligent Operations Command Center — FFF Enterprises executive demo (synthetic data)"
      source_code_path: ..
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: genie-space
          genie_space:
            name: RNI Inventory Intelligence Agent
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
